name: Bharat Intraday Scout 2.0

on:
  schedule:
    # Weekly NSE equity universe/liquidity refresh: Sunday 08:30 IST = 03:00 UTC.
    - cron: '0 3 * * 0'
    # Auto-start: 09:00 IST (03:30 UTC) -> waits internally until 09:20:10 IST, then scans every 5 min.
    # 09:15 IST (03:45 UTC) is a backup start in case GitHub drops/delays the first one (queued, harmless if already running).
    - cron: '30,45 3 * * 1-5'
    # Daily self-learning (grade alerts, study top gainers/losers, update filters, Telegram report): 15:35 IST = 10:05 UTC.
    - cron: '5 10 * * 1-5'
  workflow_dispatch:
    inputs:
      task:
        description: 'Choose a task (backtest-learn reverse-engineers top movers & tunes weights)'
        required: true
        type: choice
        default: scan
        options:
          - scan
          - daily-learn
          - backtest-learn
          - reset-today-quota
          - dry-run-v2
          - refresh-universe
          - test-telegram
          - test-kronos
      target_symbol:
        description: 'Optional NSE symbol for backtest-learn (e.g. GROWW, CGPOWER; leave blank for Top 10 Day-High Movers)'
        required: false
        type: string
        default: ''

# Prevent two runs from mutating SQLite state or running duplicate loops simultaneously.
concurrency:
  group: bis20-main-runner
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run-scanner:
    if: github.event_name != 'schedule' || vars.BIS_SCANNER_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      HF_HUB_DISABLE_PROGRESS_BARS: '1'
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TAURIC_API_KEY: ${{ secrets.TAURIC_API_KEY }}
      TARGET_SYMBOL: ${{ inputs.target_symbol }}
      PRICE_FLOOR: '50'
      MIN_AVG_TURNOVER_INR: '50000000'
      INTRADAY_UNIVERSE_SIZE: '200'
      MIN_DAY_MOVE_PCT: '0.4'
      MAX_DAY_MOVE_PCT: '5.0'
      LIMIT_BEFORE_10AM: '10'
      LIMIT_10AM_TO_1PM: '10'
      LIMIT_1PM_TO_2PM: '5'
      LIMIT_AFTER_2PM: '2'
      MAX_SIGNALS_PER_CYCLE: '3'
      CONTINUOUS_LOOP_MINUTES: '390'
      KRONOS_ENABLED: 'true'
      KRONOS_REQUIRED: 'true'
      KRONOS_PRED_LEN: '6'
      KRONOS_SAMPLE_COUNT: '3'
      TRADING_R1_ENABLED: 'true'
      TRADING_R1_REQUIRED: 'false'
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main

      - name: Select task and check market hours
        id: task
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          MANUAL_TASK: ${{ inputs.task }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE_CRON" == "0 3 * * 0" ]]; then
            TASK="refresh-universe"
          elif [[ "$EVENT_NAME" == "schedule" && "$SCHEDULE_CRON" == "5 10 * * 1-5" ]]; then
            TASK="daily-learn"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TASK="${MANUAL_TASK:-scan}"
          else
            TASK="scan"
          fi
          echo "name=$TASK" >> "$GITHUB_OUTPUT"

          IST_HM=$(TZ="Asia/Kolkata" date +%H%M)
          IST_DOW=$(TZ="Asia/Kolkata" date +%u)
          if [[ "$EVENT_NAME" == "schedule" && "$TASK" == "scan" ]]; then
            if (( IST_DOW > 5 || 10#$IST_HM < 830 || 10#$IST_HM > 1520 )); then
              echo "skip_outside_hours=true" >> "$GITHUB_OUTPUT"
              echo "Scheduled run triggered at IST $IST_HM (outside 08:30-15:20 IST); skipping cleanly."
              exit 0
            fi
          fi
          echo "skip_outside_hours=false" >> "$GITHUB_OUTPUT"
          echo "Selected task: $TASK (IST $IST_HM)"

      - name: Set up Python 3.11
        if: steps.task.outputs.skip_outside_hours != 'true'
        id: setup-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Restore Python environment cache
        if: steps.task.outputs.skip_outside_hours != 'true'
        id: python-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .venv
          key: bis20-venv-ubuntu-${{ steps.setup-python.outputs.python-version }}-v3-${{ hashFiles('requirements.txt') }}

      - name: Ensure healthy Python virtual environment
        if: steps.task.outputs.skip_outside_hours != 'true'
        shell: bash
        run: |
          if [ ! -x .venv/bin/python ] || ! .venv/bin/python -c "import numpy, pandas, yfinance, requests, torch" >/dev/null 2>&1; then
            echo "Building fresh .venv for Python ${{ steps.setup-python.outputs.python-version }}..."
            rm -rf .venv
            python -m venv .venv
            .venv/bin/python -m pip install --upgrade pip
            .venv/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.7.1+cpu'
            .venv/bin/python -m pip install -r requirements.txt
          else
            echo "Cached .venv verified healthy for Python ${{ steps.setup-python.outputs.python-version }}."
          fi

      - name: Restore Kronos model cache
        if: steps.task.outputs.skip_outside_hours != 'true' && (steps.task.outputs.name == 'scan' || steps.task.outputs.name == 'test-kronos' || steps.task.outputs.name == 'dry-run-v2' || steps.task.outputs.name == 'backtest-learn')
        id: hf-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .cache/huggingface
          key: bis20-hf-kronos-mini-tokenizer2k-v1

      - name: Clone official Kronos source
        if: steps.task.outputs.skip_outside_hours != 'true' && (steps.task.outputs.name == 'scan' || steps.task.outputs.name == 'test-kronos' || steps.task.outputs.name == 'dry-run-v2' || steps.task.outputs.name == 'backtest-learn')
        run: |
          rm -rf vendor/Kronos
          git clone --depth 1 https://github.com/shiyu-coder/Kronos.git vendor/Kronos || echo "Warning: Kronos clone failed; running technical strategy."

      - name: Run Bharat Intraday Scout (Tri-Engine + Self-Learning Backtester)
        if: steps.task.outputs.skip_outside_hours != 'true'
        env:
          TASK_NAME: ${{ steps.task.outputs.name }}
          TARGET_SYM: ${{ inputs.target_symbol }}
        run: .venv/bin/python scanner.py --task "$TASK_NAME" --symbol "$TARGET_SYM"

      - name: Upload diagnostic / backtest-learn report
        if: always() && (steps.task.outputs.name == 'dry-run-v2' || steps.task.outputs.name == 'backtest-learn')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bis20-backtest-learning-report
          path: |
            dry_run_v2_report.json
            data/learned_strategy_weights.json
          if-no-files-found: warn
          retention-days: 14

      - name: Commit scanner state and learned strategy weights
        if: always() && steps.task.outputs.skip_outside_hours != 'true' && steps.task.outputs.name != 'dry-run-v2'
        shell: bash
        run: |
          cp runtime/bis20.sqlite3 /tmp/bis20.sqlite3.bak 2>/dev/null || true
          cp data/liquid_universe.json /tmp/liquid_universe.json.bak 2>/dev/null || true
          cp data/learned_strategy_weights.json /tmp/learned_strategy_weights.json.bak 2>/dev/null || true
          cp data/learned_filters.json /tmp/learned_filters.json.bak 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main || true
          git reset --hard origin/main || true
          cp /tmp/bis20.sqlite3.bak runtime/bis20.sqlite3 2>/dev/null || true
          cp /tmp/liquid_universe.json.bak data/liquid_universe.json 2>/dev/null || true
          cp /tmp/learned_strategy_weights.json.bak data/learned_strategy_weights.json 2>/dev/null || true
          cp /tmp/learned_filters.json.bak data/learned_filters.json 2>/dev/null || true
          git add runtime/bis20.sqlite3 data/liquid_universe.json data/learned_strategy_weights.json data/learned_filters.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "BIS 2.0: persist scanner state & learned weights [skip ci]" || true
            git push origin HEAD:main || true
          else
            echo "No state/cache changes to commit."
          fi

